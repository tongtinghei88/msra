<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地盤風險評估系統</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">地盤風險評估系統</a>
      <div class="nav-links">
        <a href="index.html" class="active">評估列表</a>
        <a href="create.html">新增評估</a>
        <a href="templates.html">範本管理</a>
      </div>
      <div class="nav-auth">
        <button id="loginBtn" class="btn btn-sm">登入</button>
        <span id="userInfo" class="user-info" style="display:none"></span>
      </div>
    </div>
  </nav>

  <main class="container">
    <header class="page-header">
      <h1>風險評估記錄</h1>
      <a href="create.html" class="btn btn-primary">+ 新增評估</a>
    </header>

    <section class="filters">
      <input type="text" id="searchInput" placeholder="搜尋專案名稱..." class="input">
      <select id="sortSelect" class="input">
        <option value="dateDesc">最新優先</option>
        <option value="dateAsc">最舊優先</option>
        <option value="nameAsc">名稱 A-Z</option>
        <option value="nameDesc">名稱 Z-A</option>
      </select>
    </section>

    <section id="assessmentList" class="card-grid">
      <p class="text-muted">載入中...</p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/risk-assessment.js"></script>
</body>
</html>
